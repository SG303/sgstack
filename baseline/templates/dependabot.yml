# Dependabot config (baseline v1). Copy to .github/dependabot.yml and keep only
# the ecosystems the repo uses. Weekly on Sunday evening, minor and patch
# updates grouped into one PR per ecosystem; the auto-merge workflow merges
# them once the required checks pass. Majors come as separate PRs for review.
# The 7-day cooldown skips versions younger than a week (most malicious
# releases are found and pulled by then); security updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  # Python with uv (pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  # Node with npm (package.json + package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7

  # Images in compose.yaml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
